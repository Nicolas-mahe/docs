services:
  docusaurus:
    restart: ${RESTART:-unless-stopped}
    image: ghcr.io/nicolas-mahe/docs:${DOCKER_TAG_DOCS:-main}
    container_name: ${COMPOSE_PROJECT_NAME:-docusaurus}
    hostname: ${COMPOSE_PROJECT_NAME:-docusaurus}
    labels:
      traefik.enable: true
      traefik.http.routers.docusaurus.tls: true
      traefik.http.routers.docusaurus.tls.certresolver: cloudflare
      traefik.http.routers.docusaurus.middlewares: authelia@docker,web-utils@docker
      traefik.http.routers.docusaurus.entrypoints: websecure
      traefik.http.routers.docusaurus.rule: Host(`docs.${PERSONAL_DOMAIN_NAME}`)
      traefik.http.routers.docusaurus.service: docusaurus
      traefik.http.services.docusaurus.loadBalancer.server.port: 80
    environment:
      TZ: Europe/Paris
    networks:
      - webinternal
networks:
  webinternal:
    name: webinternal
