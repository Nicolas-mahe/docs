name: Build Docker image

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'packages/Dockerfile'  
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      dockerfile_path:
        description: Path to the Dockerfile
        required: false
        default: packages/Dockerfile
        type: string
      image_tag:
        description: Additional image tag (defaults to the commit SHA)
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USER || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        env:
          REGISTRY: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
          IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || github.repository }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          custom_tag="${INPUT_IMAGE_TAG:-$GITHUB_SHA}"

          {
            echo "tags<<EOF"
            echo "${image}:latest"
            echo "${image}:${custom_tag}"

            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "${image}:${GITHUB_REF_NAME}"
            elif [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
              branch_tag="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9_.-]/-/g')"
              echo "${image}:${branch_tag}"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile_path || 'packages/Dockerfile' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
                      PERSONAL_DOMAIN_NAME=${{ secrets.PERSONAL_DOMAIN_NAME }}
